name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (csc, no installer needed)
        shell: cmd
        run: build.bat /nopause

      - name: Self test
        shell: cmd
        run: DiskMate.exe --selftest

      - name: Collect release notes from the tag
        shell: cmd
        run: git tag -l --format="%(contents)" ${{ github.ref_name }} > release-notes.txt

      - name: Generate version.txt
        shell: cmd
        run: >-
          DiskMate.exe
          --writeversion=version.txt|https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/DiskMate.exe|@release-notes.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: DiskMate ${{ github.ref_name }}
          body_path: release-notes.txt
          files: |
            DiskMate.exe
            version.txt

      - name: Commit version.txt to main
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add version.txt
          git diff --staged --quiet || git commit -m "chore: version.txt for ${{ github.ref_name }}"
          git push origin main
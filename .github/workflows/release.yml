name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (csc, no installer needed)
        shell: cmd
        run: build.bat /nopause

      - name: Self test
        shell: cmd
        run: DiskMate.exe --selftest

      - name: Collect release notes
        shell: cmd
        run: |
          if exist "docs\release-notes-${{ github.ref_name }}.md" (
            copy /y "docs\release-notes-${{ github.ref_name }}.md" release-notes.txt >nul
          ) else (
            git tag -l -n 9999 "${{ github.ref_name }}" > release-notes.txt
          )

      - name: Generate version.txt
        shell: cmd
        env:
          DISKMATE_EXE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/DiskMate.exe
          DISKMATE_NOTES_FILE: release-notes.txt
        run: DiskMate.exe --writeversion=version.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: DiskMate ${{ github.ref_name }}
          body_path: release-notes.txt
          files: |
            DiskMate.exe
            version.txt

      - name: Commit version.txt to main
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add version.txt
          git diff --staged --quiet || git commit -m "chore: version.txt for ${{ github.ref_name }}"
          git pull --rebase origin main
          git push origin main